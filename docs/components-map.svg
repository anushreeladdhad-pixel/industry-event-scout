<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#312e81"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4338ca"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#f5f3ee"/>
  <rect width="1600" height="120" fill="url(#g)"/>
  <text x="48" y="62" font-size="42" font-weight="700" fill="#fff" font-family="Georgia, serif">Event Scout: how it works</text>
  <text x="48" y="98" font-size="22" fill="#d9d6ff">Every Monday at 7:30 AM, one email lists the best events in your cities. You decide; it never signs you up for anything.</text>

  <!-- the 5 steps -->
  <text x="48" y="170" font-size="18" font-weight="700" fill="#6b6878" letter-spacing="3">THE MONDAY JOURNEY</text>
  <g>
    <!-- step boxes: x = 48, 354, 660, 966, 1272  width 280 -->
    <g>
      <rect x="48" y="190" width="280" height="250" rx="22" fill="#fff" stroke="#c9c5d9" stroke-width="2"/>
      <circle cx="88" cy="232" r="22" fill="#4338ca"/><text x="88" y="240" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="124" y="240" font-size="26" font-weight="700" fill="#16151d">Wake up</text>
      <text x="72" y="290" font-size="20" fill="#333">An alarm goes off every</text>
      <text x="72" y="318" font-size="20" fill="#333">Monday at 7:30 AM.</text>
      <text x="72" y="368" font-size="17" fill="#6b6878">Made by: Vercel Cron</text>
    </g>
    <g>
      <rect x="354" y="190" width="280" height="250" rx="22" fill="#fff" stroke="#c9c5d9" stroke-width="2"/>
      <circle cx="394" cy="232" r="22" fill="#4338ca"/><text x="394" y="240" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="430" y="240" font-size="26" font-weight="700" fill="#16151d">Find events</text>
      <text x="378" y="290" font-size="20" fill="#333">It checks Eventbrite,</text>
      <text x="378" y="318" font-size="20" fill="#333">newsletters and the web.</text>
      <text x="378" y="368" font-size="17" fill="#6b6878">A broken source never</text>
      <text x="378" y="392" font-size="17" fill="#6b6878">stops the rest.</text>
    </g>
    <g>
      <rect x="660" y="190" width="280" height="250" rx="22" fill="#fff" stroke="#c9c5d9" stroke-width="2"/>
      <circle cx="700" cy="232" r="22" fill="#4338ca"/><text x="700" y="240" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <text x="736" y="240" font-size="26" font-weight="700" fill="#16151d">Clean up</text>
      <text x="684" y="290" font-size="20" fill="#333">Removes repeats and</text>
      <text x="684" y="318" font-size="20" fill="#333">events that are too far,</text>
      <text x="684" y="346" font-size="20" fill="#333">in other cities, or closed.</text>
    </g>
    <g>
      <rect x="966" y="190" width="280" height="250" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
      <circle cx="1006" cy="232" r="22" fill="#7c3aed"/><text x="1006" y="240" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="1042" y="240" font-size="26" font-weight="700" fill="#16151d">Rank them</text>
      <text x="990" y="290" font-size="20" fill="#333">AI scores each event</text>
      <text x="990" y="318" font-size="20" fill="#333">0 to 100 on how well it</text>
      <text x="990" y="346" font-size="20" fill="#333">fits your topics.</text>
      <text x="990" y="396" font-size="17" fill="#6b6878">Made by: Gemini AI</text>
    </g>
    <g>
      <rect x="1272" y="190" width="280" height="250" rx="22" fill="#e4f5ea" stroke="#15803d" stroke-width="3"/>
      <circle cx="1312" cy="232" r="22" fill="#15803d"/><text x="1312" y="240" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <text x="1348" y="240" font-size="26" font-weight="700" fill="#16151d">Email you</text>
      <text x="1296" y="290" font-size="20" fill="#333">You get one list. Events</text>
      <text x="1296" y="318" font-size="20" fill="#333">closing in under 7 days</text>
      <text x="1296" y="346" font-size="20" fill="#333">are flagged in red.</text>
      <text x="1296" y="396" font-size="17" fill="#6b6878">Sent by: Resend</text>
    </g>
  </g>
  <g stroke="#4338ca" stroke-width="4" fill="none" marker-end="url(#a)">
    <path d="M332 315 H350"/><path d="M638 315 H656"/><path d="M944 315 H962"/><path d="M1250 315 H1268"/>
  </g>

  <!-- helpers -->
  <text x="48" y="500" font-size="18" font-weight="700" fill="#6b6878" letter-spacing="3">THE TOOLS BEHIND IT</text>
  <g>
    <rect x="48" y="520" width="360" height="170" rx="22" fill="#fff" stroke="#c9c5d9" stroke-width="2"/>
    <text x="72" y="562" font-size="26" font-weight="700" fill="#16151d">Website (Vercel)</text>
    <text x="72" y="600" font-size="20" fill="#333">Shows the event table and a</text>
    <text x="72" y="628" font-size="20" fill="#333">settings page. Hosts everything.</text>
    <text x="72" y="666" font-size="17" fill="#6b6878">Built with Next.js</text>

    <rect x="438" y="520" width="360" height="170" rx="22" fill="#fff" stroke="#c9c5d9" stroke-width="2"/>
    <text x="462" y="562" font-size="26" font-weight="700" fill="#16151d">Memory (Supabase)</text>
    <text x="462" y="600" font-size="20" fill="#333">Remembers your topics, cities</text>
    <text x="462" y="628" font-size="20" fill="#333">and rules. Change them any</text>
    <text x="462" y="656" font-size="20" fill="#333">time, no coding needed.</text>

    <rect x="828" y="520" width="360" height="170" rx="22" fill="#fff" stroke="#c9c5d9" stroke-width="2"/>
    <text x="852" y="562" font-size="26" font-weight="700" fill="#16151d">AI brain (Gemini)</text>
    <text x="852" y="600" font-size="20" fill="#333">Reads messy newsletters and</text>
    <text x="852" y="628" font-size="20" fill="#333">scores how well events match.</text>
    <text x="852" y="666" font-size="17" fill="#6b6878">Code double-checks its answers</text>

    <rect x="1218" y="520" width="334" height="170" rx="22" fill="#fff" stroke="#c9c5d9" stroke-width="2"/>
    <text x="1242" y="562" font-size="26" font-weight="700" fill="#16151d">Mailman (Resend)</text>
    <text x="1242" y="600" font-size="20" fill="#333">Delivers the email to your</text>
    <text x="1242" y="628" font-size="20" fill="#333">inbox. Only to you.</text>
  </g>

  <!-- bottom row -->
  <g>
    <rect x="48" y="730" width="740" height="220" rx="22" fill="#fff" stroke="#c9c5d9" stroke-width="2"/>
    <text x="72" y="774" font-size="26" font-weight="700" fill="#16151d">If something breaks, the email still goes out</text>
    <text x="72" y="816" font-size="21" fill="#333">• A source is down → the email says which one.</text>
    <text x="72" y="850" font-size="21" fill="#333">• AI is busy → events are ranked by keywords instead.</text>
    <text x="72" y="884" font-size="21" fill="#333">• Settings can't load → default settings are used.</text>
    <text x="72" y="918" font-size="21" fill="#333">• No deadline listed → it says so, never guesses.</text>

    <rect x="828" y="730" width="724" height="220" rx="22" fill="#fff" stroke="#c9c5d9" stroke-width="2"/>
    <text x="852" y="774" font-size="26" font-weight="700" fill="#16151d">You are in control</text>
    <text x="852" y="816" font-size="21" fill="#333">• Pick your topics and cities on the Settings page.</text>
    <text x="852" y="850" font-size="21" fill="#333">• A secret password protects "send" and "save".</text>
    <text x="852" y="884" font-size="21" fill="#333">• It only suggests. It never registers you, contacts</text>
    <text x="852" y="912" font-size="21" fill="#333">   anyone, or touches your calendar.</text>
  </g>
</svg>
